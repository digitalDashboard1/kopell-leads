<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOPELL GROUP · דשבורד לידים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --background: #f3f8fd;
    --surface: #ffffff;
    --border: #c6d8ed;
    --text: #101d3d;
    --muted: #7b8ba3;
    --brand: #005e93;
    --green: #007639;
    --orange: #ef8200;
    --purple: #513094;
    --blue: #005b94;
    --radius: 24px;
    --input-radius: 10px;
    --pad: 24px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Heebo', Arial, sans-serif;
    background: var(--background);
    color: var(--text);
    line-height: 1.25;
  }

  .page {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 24px var(--pad) 20px;
    max-width: 1280px;
    margin: 0 auto;
  }

  /* ---------- Header ---------- */
  header {
    min-height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .title { display: flex; align-items: center; gap: 14px; }
  .title h1 { font-weight: 900; font-size: 40px; white-space: nowrap; }
  .title svg { width: 42px; height: 42px; flex-shrink: 0; }
  .logo-main { width: min(246px, 32vw); height: auto; display: block; mix-blend-mode: multiply; }

  .logo-fallback { font-weight: 800; color: var(--brand); letter-spacing: .5px; white-space: nowrap; }

  /* ---------- Filters ---------- */
  .filters {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px 18px;
    flex-shrink: 0;
  }
  .filter-row {
    display: flex;
    align-items: flex-end;
    gap: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .field.date { flex: 1 1 0; }
  .field.time { flex: 0 0 145.6px; }
  .field label { font-weight: 700; font-size: 15px; }

  .input {
    position: relative;
    height: 48px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--input-radius);
    overflow: hidden;
  }
  .input input {
    width: 100%; height: 100%;
    border: 0; outline: 0; background: transparent;
    font: 500 18px 'Heebo', Arial, sans-serif;
    color: var(--text);
    direction: ltr; text-align: left;
    padding: 0 42px 0 12px;
    appearance: none; -webkit-appearance: none;
  }
  .input input::-webkit-calendar-picker-indicator {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer;
  }
  .input input::-webkit-datetime-edit { padding: 0; }
  .input svg { position: absolute; right: 12px; top: 13px; width: 22px; height: 22px; pointer-events: none; }
  .input:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(0,94,147,.15); }

  .btn {
    flex: 0 0 130px;
    height: 48px;
    border: 0; border-radius: 11px;
    background: var(--brand); color: #fff;
    font: 500 18px 'Heebo', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer;
  }
  .btn svg { width: 22px; height: 22px; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }

  .summary { font-size: 12px; color: var(--muted); flex-shrink: 0; min-height: 15px; }
  .summary.error { color: #c0392b; font-weight: 500; }

  /* ---------- Cards ---------- */
  .cards {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 1fr;
    gap: 18px;
    direction: ltr; /* סדר הקוביות כמו בעיצוב: משכנתוק משמאל, MediWho מימין */
  }
  .card {
    direction: rtl;
    --tint: #dbf4e7;
    --accent: var(--green);
    position: relative;
    overflow: hidden;
    min-height: 180px;
    border: 3px solid var(--surface);
    border-radius: var(--radius);
    background: linear-gradient(to right, var(--tint) 0%, #fff 60%, var(--tint) 100%);
    box-shadow: 0 6px 12px rgba(31, 71, 115, .16);
  }
  .card.green  { --tint: #dbf4e7; --accent: var(--green); }
  .card.orange { --tint: #fff0da; --accent: var(--orange); }
  .card.purple { --tint: #e9dffc; --accent: var(--purple); }
  .card.blue   { --tint: #d6ecfc; --accent: var(--blue); }

  .accent {
    position: absolute; top: 0; bottom: 0; right: 0;
    width: 29.1%;
  }
  .accent svg { width: 100%; height: 100%; display: block; fill: var(--accent); }
  .card-icon { position: absolute; bottom: 15px; right: 10px; width: 36px; height: 36px; }

  .card-body {
    position: absolute; top: 0; bottom: 0; left: 0; right: 28.45%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
  }
  .brand {
    height: 72px; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .brand img { width: auto; max-width: 85%; object-fit: contain; display: block; mix-blend-mode: multiply; }
  .card[data-key="mashkantok"] .brand img { height: 69px; }
  .card[data-key="mediwho"]    .brand img { height: 50px; }
  .card[data-key="electro"]    .brand img { height: 62px; }
  .brand .hr-title { font-weight: 900; font-size: 40px; }
  .brand .hr-sub { font-size: 13px; }
  .metric {
    width: min(265px, 90%);
    border-top: 1px solid var(--border);
    padding-top: 7px;
    display: flex; flex-direction: column; align-items: center;
  }
  .metric .label { font-size: 22px; color: var(--muted); }
  .metric .count {
    font-weight: 800; font-size: 62px; color: var(--accent);
    font-variant-numeric: tabular-nums; direction: ltr;
    transition: opacity .2s;
  }
  .card.loading .count { opacity: .35; }

  /* ---------- Footer ---------- */
  footer {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted);
    flex-shrink: 0;
  }
  footer .brand-text { direction: ltr; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-left: 5px; }
  .dot.ok { background: #1a9a52; }
  .dot.err { background: #c0392b; }

  /* ---------- Tablet portrait / narrow ---------- */
  @media (max-width: 860px) {
    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
      align-items: start;
    }
    .field.date, .field.time { flex: none; }
    .btn { grid-column: 1 / -1; width: 100%; height: 42px; flex: none; }
    .title h1 { font-size: 36px; }
  }
  @media (max-width: 560px) {
    .filter-row { grid-template-columns: 1.3fr 1fr; gap: 12px; }
    .field label { font-size: 14px; }
    .input input { font-size: 16px; padding-left: 10px; }
    .input svg { right: 10px; }
    .page { padding: 16px 14px 16px; }
    .card { min-height: 190px; }
    .card[data-key="mashkantok"] .brand img { height: 60px; }
    .card[data-key="mediwho"]    .brand img { height: 44px; }
    .card[data-key="electro"]    .brand img { height: 54px; }
    .title h1 { font-size: 28px; }
    .title svg { width: 32px; height: 32px; }
    header .logo-fallback { font-size: 15px !important; }
    header { gap: 8px; }
    .cards { grid-template-columns: 1fr; }
    .metric .count { font-size: 52px; }
  }
</style>
</head>

<script>
(function () {
  'use strict';

  /* ===== הגדרות ===== */
  // הדביקי כאן את כתובת ה־Web app של Apps Script (נגמרת ב־/exec).
  // כל עוד השדה ריק, הדשבורד מציג נתוני הדגמה.
  var API_URL = 'https://script.google.com/macros/s/AKfycbz6ocfbdaHZauoM8rOnV8bDNjjeG-kGjVbzSfH8-zpOYJSj_Sg-M7iNJ37lLioS50U/exec';
  var TZ = 'Asia/Jerusalem';
  var DEFAULT_WINDOW_MS = 24 * 3600 * 1000; // ברירת מחדל: 24 שעות אחרונות
  var REFRESH_MS = 60 * 60 * 1000;          // רענון אוטומטי פעם בשעה (למסך טלוויזיה)
  var RETRY_MS = 2 * 60 * 1000;             // אם הרענון נכשל (למשל נפל האינטרנט): ניסיון חוזר אחרי 2 דקות

  /* ===== עזרי זמן (שעון ישראל, בלי תלות באזור הזמן של המכשיר) ===== */
  var fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ, hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  function wallParts(ms) {
    var o = {};
    fmt.formatToParts(new Date(ms)).forEach(function (p) { o[p.type] = p.value; });
    return { y: +o.year, mo: +o.month, d: +o.day, h: +o.hour, mi: +o.minute, s: +o.second };
  }
  function offsetAt(ms) { // הפרש (ms) בין שעון ישראל ל־UTC ברגע נתון
    var w = wallParts(ms);
    return Date.UTC(w.y, w.mo - 1, w.d, w.h, w.mi, w.s) - Math.floor(ms / 1000) * 1000;
  }
  function wallToEpoch(dateStr, timeStr) { // "2026-11-08" + "14:30" (שעון ישראל) → epoch ms
    var d = dateStr.split('-').map(Number), t = timeStr.split(':').map(Number);
    var guess = Date.UTC(d[0], d[1] - 1, d[2], t[0], t[1], 0);
    var ms = guess - offsetAt(guess);
    return guess - offsetAt(ms);
  }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function toInputs(ms) {
    var w = wallParts(ms);
    return { date: w.y + '-' + p2(w.mo) + '-' + p2(w.d), time: p2(w.h) + ':' + p2(w.mi) };
  }
  function labelDate(ms) { var w = wallParts(ms); return p2(w.d) + '.' + p2(w.mo) + '.' + w.y; }
  function labelTime(ms) { var w = wallParts(ms); return p2(w.h) + ':' + p2(w.mi); }

  /* ===== אלמנטים ===== */
  var $ = function (id) { return document.getElementById(id); };
  var el = { sd: $('startDate'), st: $('startTime'), ed: $('endDate'), et: $('endTime'),
             apply: $('apply'), summary: $('summary'), status: $('status') };
  var cards = {};
  document.querySelectorAll('.card').forEach(function (c) { cards[c.dataset.key] = c; });

  /* ===== מצב ===== */
  var rolling = true;     // true = ברירת המחדל (24 שעות אחרונות מרגע הפתיחה), false = טווח שנבחר ידנית
  var reqId = 0;

  function setDefaultWindow() {
    var now = Date.now();
    var a = toInputs(now - DEFAULT_WINDOW_MS), b = toInputs(now);
    el.sd.value = a.date; el.st.value = a.time;
    el.ed.value = b.date; el.et.value = b.time;
  }

  function readRange() {
    if (!el.sd.value || !el.st.value || !el.ed.value || !el.et.value) return null;
    return { from: wallToEpoch(el.sd.value, el.st.value),
             // סוף הדקה שנבחרה, כדי שלידים באותה דקה ייספרו
             to: wallToEpoch(el.ed.value, el.et.value) + 59999 };
  }

  function setSummary(range, isRolling) {
    el.summary.classList.remove('error');
    var text;
    if (labelDate(range.from) === labelDate(range.to)) {
      text = 'סקירת לידים  ·  ' + labelDate(range.from) + '  |  ' + labelTime(range.from) + '–' + labelTime(range.to);
    } else {
      text = 'סקירת לידים  ·  ' + labelDate(range.from) + ' ' + labelTime(range.from) +
             '  –  ' + labelDate(range.to) + ' ' + labelTime(range.to);
    }
    if (isRolling) text += '  ·  24 שעות אחרונות';
    el.summary.textContent = text;
  }

  function setStatus(kind, text) {
    el.status.innerHTML = '<span class="dot ' + (kind || '') + '"></span>';
    el.status.appendChild(document.createTextNode(text));
  }

  function showCounts(counts) {
    Object.keys(cards).forEach(function (k) {
      cards[k].classList.remove('loading');
      cards[k].querySelector('.count').textContent = (counts && counts[k] != null) ? counts[k] : '—';
    });
  }
  function setLoading() {
    Object.keys(cards).forEach(function (k) { cards[k].classList.add('loading'); });
  }

  /* ===== נתוני הדגמה (כשאין API_URL) ===== */
  function demoCounts(range) {
    var hours = Math.max(0, (range.to - range.from) / 3600000);
    var rate = { mashkantok: 52, mediwho: 119, hr: 18, electro: 82 };
    var out = {};
    Object.keys(rate).forEach(function (k) { out[k] = Math.round(rate[k] * hours / 24); });
    return out;
  }

  /* ===== טעינה ===== */
  var timer = null;
  function scheduleRefresh(ms) {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (rolling) setDefaultWindow(); // ברירת מחדל: 24 השעות האחרונות מהרגע הזה. טווח שנבחר ידנית נשאר כמו שהוא
      load(true);                      // רענון שקט: המספרים נשארים על המסך עד שמגיעים החדשים
    }, ms);
  }

  function load(silent) { // silent = רענון אוטומטי: בלי לעמעם את המספרים ובלי הודעת טעינה
    var range = readRange();
    if (!range) return;
    if (range.to < range.from) {
      el.summary.classList.add('error');
      el.summary.textContent = 'תאריך הסיום חייב להיות אחרי תאריך ההתחלה';
      return;
    }
    setSummary(range, rolling);

    if (!API_URL) {
      showCounts(demoCounts(range));
      setStatus('', 'מציג נתוני הדגמה לטווח הנבחר');
      scheduleRefresh(REFRESH_MS);
      return;
    }

    var id = ++reqId;
    if (!silent) {
      setLoading();
      setStatus('', 'טוען נתונים…');
    }
    fetch(API_URL + (API_URL.indexOf('?') < 0 ? '?' : '&') + 'from=' + range.from + '&to=' + range.to + '&_=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        if (id !== reqId) return; // תשובה ישנה
        if (!data.ok) throw new Error(data.error || 'שגיאה');
        showCounts(data.counts);
        var now = Date.now();
        setStatus('ok', 'מעודכן ' + labelTime(now) + ':' + p2(wallParts(now).s));
        scheduleRefresh(REFRESH_MS);
      })
      .catch(function (err) {
        if (id !== reqId) return;
        Object.keys(cards).forEach(function (k) { cards[k].classList.remove('loading'); });
        setStatus('err', 'שגיאה בטעינת הנתונים');
        scheduleRefresh(RETRY_MS);
        console.error('Leads dashboard:', err);
      });
  }

  /* ===== אירועים ===== */
  el.apply.addEventListener('click', function () { rolling = false; load(); });
  [el.sd, el.st, el.ed, el.et].forEach(function (i) {
    i.addEventListener('keydown', function (e) { if (e.key === 'Enter') { rolling = false; load(); } });
  });

  // תמונות שלא נטענו (לוגואים שעוד לא הועלו לתיקיית assets) → טקסט במקומם
  document.querySelectorAll('img[data-fallback]').forEach(function (img) {
    function useFallback() {
      var s = document.createElement('span');
      s.className = 'logo-fallback';
      s.textContent = img.dataset.fallback;
      s.style.fontSize = img.classList.contains('logo-main') ? '24px' : '28px';
      img.replaceWith(s);
    }
    img.addEventListener('error', useFallback);
    if (img.complete && img.naturalWidth === 0) useFallback();
  });

  /* ===== התחלה ===== */
  setDefaultWindow();
  load();
  // הנתונים נטענים: בפתיחת העמוד (או ברענון שלו), בלחיצה על "סינון", וגם אוטומטית פעם בשעה.
})();
</script>
